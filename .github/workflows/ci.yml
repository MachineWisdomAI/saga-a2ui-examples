name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Pointers, types, Workers tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate tracked Git LFS pointers
        run: python3 scripts/check-lfs.py
      # The SDK 0.11.0-rc.1 packages are not on the npm registry yet, so the pinned revision's
      # packed packages stand in for them (README: "Release constraint"). Replace this step with
      # `npm ci` once they are published and a lockfile is committed.
      - name: Install dependencies, with the pinned SDK packed locally
        run: node scripts/qualify-sdk-packages.mjs
      - name: Check
        run: npm run check
