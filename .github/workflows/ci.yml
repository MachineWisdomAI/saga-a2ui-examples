name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Pointers, types, Workers tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate tracked Git LFS pointers
        run: python3 scripts/check-lfs.py
      - name: Install dependencies from the registry and the lockfile
        run: npm ci
      - name: Install the browser for the rendered-card tests
        run: npx playwright install --with-deps chromium
      - name: Check
        run: npm run check
